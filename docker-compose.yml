services:
  client:
    build:
      dockerfile: Dockerfile.dev
      context: ./client
    container_name: client
    command: sh -c "pnpm run dev"
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING}
    volumes:
      - ./client:/app
      - /app/node_modules/
    ports:
      - "5173:5173"
    logging: &logging-template
      options:
        max-size: "5m"
        max-file: "3"

  server:
    build:
      dockerfile: Dockerfile.dev
      context: ./server
    container_name: server
    hostname: gooru-server
    command: sh -c "${AIR_START_COMMAND:-air start}"
    working_dir: /app
    restart: unless-stopped
    environment:
      GOORU_MODE: ${GOORU_MODE:-dev}
      GOORU_DB_CONNECTION: ${GOORU_DB_CONNECTION:-sqlite://booru.db}
      GOORU_PORT: ${GOORU_PORT:-8000}
    volumes:
      - ./server:/app
    ports:
      - "${GOORU_PORT:-8000}:${GOORU_PORT:-8000}"
    logging: *logging-template

  postgres:
    image: postgres:17.2-alpine
    container_name: postgres
    hostname: gooru-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gooru}
      POSTGRES_USER: ${POSTGRES_USER:-gooru_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gooru_pwd}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    restart: unless-stopped
    logging: *logging-template

volumes:
  postgres-data:
